name: Push Image To Docker Hub
on:
  push:
    tags:
      - mockserver-*
  workflow_dispatch:
    inputs:
      tag:
        description: 'comma separated list of full docker tags, i.e. mockserver/mockserver:mockserver-5.15.0,mockserver/mockserver:5.15.0,mockserver/mockserver:latest'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: checkout
        uses: chainguard-actions/actions-checkout@1e091f3973ecf53ab121c0f252a96e857a236ef5 # v3.6.0
      - name: get tags
        id: meta
        uses: chainguard-actions/docker-metadata-action@83bd1ffc7c8f40b337dabeea4c0f0129f09b0477 # v4.6.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            mockserver/mockserver
          # generate Docker tags based on the following events/attributes
          tags: |
            type=match,pattern=(.*),group=1
            type=match,pattern=mockserver-(.*),group=1
#           type=raw,value=latest,enable=false
      - name: set up QEMU
        uses: chainguard-actions/docker-setup-qemu-action@909159ce490a186a612cf47110cc1120d7e620df # v2.2.0
      - name: set up docker buildx
        uses: chainguard-actions/docker-setup-buildx-action@9e5cde6a2bfeda6fa52c81f71365a9271a46fce0 # v4.4.1
      - name: login to DockerHub
        uses: chainguard-actions/docker-login-action@4d78a58c47adb9199d114b28a2aee51d123e2879 # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and push (tag override)
        if: inputs.tag != ''
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4.2.1
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags:  ${{ inputs.tag }}
      - name: build and push (tag from release)
        if: inputs.tag == ''
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4.2.1
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags:  ${{ steps.meta.outputs.tags }}
